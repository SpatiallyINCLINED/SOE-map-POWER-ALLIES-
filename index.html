<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapping Allies, Power and Resistance in the Ecology Space</title>
<meta name="description" content="A nationwide geospatial and political ecology analysis of environmental actors across Nigeria's 36 States and FCT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/mapbox-gl@3.9.0/dist/mapbox-gl.css'">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script>window.mapboxgl||document.write('<script src="https://cdn.jsdelivr.net/npm/mapbox-gl@3.9.0/dist/mapbox-gl.js"><\/script>');</script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;color:#222;background:#fff;overflow:hidden}
button,input{font-family:inherit}

header{flex:none;padding:8px 14px;background:#fff;border-bottom:1px solid #e3e3e3;position:relative;z-index:6}
header h1{margin:0;font-size:15px;line-height:1.25;font-weight:700}
header p{margin:2px 0 0;font-size:12px;color:#666;line-height:1.3}

#stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}

#styles{position:absolute;top:10px;right:50px;z-index:3;display:flex;background:#fff;border-radius:8px;box-shadow:0 0 0 2px rgba(0,0,0,.1);overflow:hidden}
#styles button{border:0;background:#fff;padding:6px 10px;font-size:12px;cursor:pointer;color:#333}
#styles button+button{border-left:1px solid #ddd}
#styles button.on{background:#33424a;color:#fff}

#legend{position:absolute;left:10px;bottom:34px;z-index:3;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:12px;max-width:230px}
#legend summary{cursor:pointer;padding:8px 12px;font-weight:700;font-size:12.5px;list-style:none}
#legend summary::-webkit-details-marker{display:none}
#legend summary::after{content:"\25BE";float:right;margin-left:10px}
#legend[open] summary::after{content:"\25B4"}
#legend .lb{padding:0 12px 10px}
#legend .lr{display:flex;align-items:center;gap:8px;padding:2px 0;line-height:1.25}
#legend .lh{margin:6px 0 3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#777;font-weight:500}
.mini{display:inline-flex;flex:none;width:22px;height:22px;border-radius:50%;background:#555;align-items:center;justify-content:center}
.mini svg{width:14px;height:14px}
.dot{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
#legend .dot{margin-right:0}

#panel{position:absolute;top:10px;left:10px;bottom:10px;width:min(360px,calc(100% - 28px));border-radius:16px;background:#33424a;box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:4;display:none;flex-direction:column;overflow:hidden;color:#fff}
#panel.open{display:flex}
#panel.light{background:#fff;color:#222}
#phead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
#ptitle{font-size:18px;font-weight:500}
#pclose{width:32px;height:32px;border:1.5px solid currentColor;border-radius:6px;background:transparent;color:inherit;font-size:20px;line-height:1;cursor:pointer}
#pbody{flex:1;overflow-y:auto;padding:6px 14px 18px;-webkit-overflow-scrolling:touch}

.hero{display:flex;gap:12px;align-items:center;margin:2px 0 14px}
.hero p{margin:0;font-size:13.5px;line-height:1.4;opacity:.92}
.hic{flex:none;width:48px;height:48px;border-radius:50%;background:#4a5b64;display:flex;align-items:center;justify-content:center}
.hic svg{width:30px;height:30px}

.card{background:#f3f3f3;color:#222;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.card h3{margin:0 0 6px;text-align:center;font-size:17px;font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;line-height:1.3;cursor:pointer}
.row .lbl{flex:1;min-width:0}
.row small{display:block;color:#666;font-size:11.5px;margin-top:1px}
.cnt{flex:none;background:#444;color:#fff;border-radius:5px;font-size:11px;padding:1px 6px;min-width:20px;text-align:center}
.sw{flex:none;width:36px;height:20px}
.sw input{appearance:none;-webkit-appearance:none;margin:0;width:36px;height:20px;border-radius:10px;background:#c9c9c9;position:relative;cursor:pointer;transition:background .15s;display:block}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:#2e7d32}
.sw input:checked::after{transform:translateX(16px)}
.sw input:focus-visible{outline:2px solid #43879b;outline-offset:2px}

.acts{display:flex;gap:8px;margin-bottom:14px}
.acts button{flex:1;padding:11px 8px;border:0;border-radius:10px;background:#434343;color:#fff;font-size:14px;font-weight:500;cursor:pointer}
.acts button:first-child{background:#2e7d32}

.sq{width:100%;border:0;border-bottom:2px solid #555;padding:10px 4px;font-size:16px;text-align:center;outline:none;background:transparent;color:#222;margin-bottom:8px}
.sq:focus{border-bottom-color:#43879b}
.sres{display:flex;flex-direction:column}
.sr{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:9px 4px;border-bottom:1px solid #eee;cursor:pointer;color:#222;width:100%}
.sr:hover{background:#f4f7f8}
.sr .sic{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sr .sic svg{width:18px;height:18px}
.sr b{display:block;font-size:13.5px;font-weight:500;line-height:1.25}
.sr small{display:block;color:#666;font-size:11.5px;margin-top:1px}
.hint{color:#777;font-size:13px;text-align:center;padding:14px 4px}

.about h4{margin:18px 0 6px;font-size:16px;font-weight:500}
.about h4:first-child{margin-top:4px}
.about p{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#333}
.about .lr{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:13px;line-height:1.3}
.about .lr small{display:block;color:#666;font-size:11.5px}
.about table{width:100%;border-collapse:collapse;font-size:12.5px}
.about td{padding:5px 4px;border-bottom:1px solid #eee;vertical-align:top}
.about td:first-child{font-weight:500;white-space:nowrap;padding-right:10px}
.about .logo{display:block;margin:14px 0 4px}
.about .logo img{height:44px;width:auto}

#bar{flex:none;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.14);position:relative;z-index:5;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#btns{display:flex;gap:8px;overflow-x:auto;padding:12px 6px 6px;scrollbar-width:none}
#btns::-webkit-scrollbar{display:none}
#btns .btn:first-child{margin-left:auto}
#btns .btn:last-child{margin-right:auto}
.btn{position:relative;flex:0 0 auto;min-width:92px;height:60px;border:0;border-radius:12px;background:#434343;color:#fff;font-size:12.5px;font-weight:500;line-height:1.15;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 12px}
.btn svg{width:22px;height:22px}
.btn .badge{position:absolute;top:-8px;right:-4px;background:#e45b5b;color:#fff;border-radius:6px;font-size:11px;font-weight:500;padding:1px 6px;box-shadow:0 0 0 3px #fff}
.btn.active{outline:3px solid #43879b;outline-offset:2px}
#foot{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0 2px;font-size:12px;color:#444}
#foot img{height:34px;width:auto;display:block}
#foot a{display:block;line-height:0}
#foot img.si{height:40px;width:40px;border-radius:9px;object-fit:cover}
.cred{display:flex;flex-direction:column;line-height:1.35;white-space:nowrap}
.sn{font-size:12px}
.sn b{font-weight:700;letter-spacing:.04em}
#foot .sn a{display:inline;line-height:inherit;color:#0A66C2;text-decoration:none;font-weight:500;margin-left:8px}
.about .sn{font-size:13.5px}
.about .si{height:44px;width:44px;border-radius:10px;object-fit:cover;vertical-align:middle;margin-right:10px}

.mapboxgl-popup-content{padding:0;border-radius:12px;overflow:hidden;font-family:inherit;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.mapboxgl-popup-close-button{font-size:22px;color:#fff;padding:0 9px;z-index:2;line-height:1.5}
.pop{width:min(300px,72vw);max-height:min(58vh,380px);overflow-y:auto}
.ph{display:flex;gap:10px;align-items:center;padding:12px 34px 12px 12px;color:#fff}
.ph svg{flex:none;width:30px;height:30px}
.pn{font-weight:700;font-size:14px;line-height:1.25}
.pm{font-size:11.5px;opacity:.93;margin-top:2px}
.pb{padding:10px 12px 12px;font-size:13px;line-height:1.45;color:#222}
.pb .loc{color:#555;font-size:12px;margin-bottom:4px}
.pb .iss{display:inline-block;background:#eef3f4;color:#2d4a52;border-radius:6px;padding:2px 8px;font-size:11.5px;margin:4px 0 6px}
.pb a{color:#1565C0;font-size:12px;word-break:break-all}
.pt{padding:11px 34px 9px 12px;font-weight:700;font-size:13px;background:#33424a;color:#fff}
.pop details{border-top:1px solid #eee}
.pop summary{cursor:pointer;display:flex;gap:8px;align-items:center;padding:9px 12px;font-size:13px;font-weight:500;list-style:none;color:#222}
.pop summary::-webkit-details-marker{display:none}
.pop summary .sic{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pop summary .sic svg{width:15px;height:15px}

@media (max-width:700px){
  header p{display:none}
  header h1{font-size:13.5px}
  #styles{right:46px}
  #styles button{padding:6px 8px;font-size:11.5px}
}
</style>
</head>

function icon(c, col, px){
  return '<svg viewBox="0 0 24 24" width="'+px+'" height="'+px+'" aria-hidden="true">'+IC[c].replace(/COL/g, col)+'</svg>';
}
function markerSVG(c, col){
  return '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">'
    + '<circle cx="32" cy="32" r="29" fill="'+col+'" stroke="#fff" stroke-width="4"/>'
    + '<g transform="translate(12.8,12.8) scale(1.6)">'+IC[c].replace(/COL/g, col)+'</g></svg>';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
function cnt(fn){ var n=0; for (var i=0;i<A.length;i++) if (fn(A[i])) n++; return n; }

/* ---------- Filter state ---------- */
var F = CATS.map(function(){
  return {on:true, q:new Set(QUADS.map(function(_,i){return i;})), z:new Set(ZONES.map(function(_,i){return i;}))};
});
function vis(a){ var f=F[a.c]; return f.on && f.q.has(a.q) && f.z.has(a.z); }

var FEATS = A.map(function(a,i){
  return {type:'Feature', properties:{id:i, icon:'m-'+a.c+'-'+a.q}, geometry:{type:'Point', coordinates:[a.lo, a.la]}};
});
function currentData(){
  return {type:'FeatureCollection', features:FEATS.filter(function(f,i){ return vis(A[i]); })};
}

/* ---------- Map ---------- */
mapboxgl.accessToken = MAPBOX_TOKEN;
var map = new mapboxgl.Map({
  container:'map',
  style:STYLE_BASE+'streets-v12',
  projection:'mercator',
  bounds:[[2.6,4.0],[14.9,14.0]],
  fitBoundsOptions:{padding:8}
});
map.addControl(new mapboxgl.NavigationControl({showCompass:false}), 'top-right');
map.touchZoomRotate.disableRotation();
map.dragRotate.disable();

var imgCache = null;
function loadImages(){
  if (imgCache) return imgCache;
  var jobs = [];
  CATS.forEach(function(_, c){
    QUADS.forEach(function(q, k){
      jobs.push(new Promise(function(res, rej){
        var im = new Image(64, 64);
        im.onload = function(){ res({id:'m-'+c+'-'+k, img:im}); };
        im.onerror = rej;
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markerSVG(c, q.color));
      }));
    });
  });
  imgCache = Promise.all(jobs);
  return imgCache;
}

function initLayers(){
  loadImages().then(function(list){
    list.forEach(function(o){ if (!map.hasImage(o.id)) map.addImage(o.id, o.img, {pixelRatio:2}); });
    if (!map.getSource('actors')){
      map.addSource('actors', {type:'geojson', data:currentData(), cluster:true, clusterMaxZoom:11, clusterRadius:42});
    }
    if (!map.getLayer('clusters')){
      map.addLayer({id:'clusters', type:'circle', source:'actors', filter:['has','point_count'],
        paint:{'circle-color':'#2b4a5e','circle-radius':['step',['get','point_count'],16,10,20,30,25],'circle-stroke-width':3,'circle-stroke-color':'#fff'}});
      map.addLayer({id:'cluster-count', type:'symbol', source:'actors', filter:['has','point_count'],
        layout:{'text-field':['get','point_count_abbreviated'],'text-font':['DIN Pro Medium','Arial Unicode MS Bold'],'text-size':13,'text-allow-overlap':true},
        paint:{'text-color':'#fff'}});
      map.addLayer({id:'actor-pts', type:'symbol', source:'actors', filter:['!',['has','point_count']],
        layout:{'icon-image':['get','icon'],'icon-size':['interpolate',['linear'],['zoom'],4,0.7,8,0.9,12,1.1],'icon-allow-overlap':true,'icon-ignore-placement':true}});
    }
  });
}
map.on('style.load', initLayers);

var popup = null;
function popupIcon(a){ return '<span class="sic" style="background:'+QUADS[a.q].color+'">'+icon(a.c, QUADS[a.q].color, 15)+'</span>'; }
function detail(a){
  var h = '<div class="pb"><div class="loc">'+esc(a.s)+' &middot; '+esc(ZONES[a.z].n)+' zone</div>'
        + '<div>'+esc(a.d)+'</div>'
        + '<div class="iss">'+esc(ZONES[a.z].i)+'</div>';
  if (a.u){
    var host = a.u; try { host = new URL(a.u).hostname.replace(/^www\./,''); } catch(e){}
    h += '<div><a href="'+esc(a.u)+'" target="_blank" rel="noopener">Source: '+esc(host)+'</a></div>';
  }
  return h + '</div>';
}
function openPopup(ids, lngLat){
  if (popup) popup.remove();
  var html;
  if (ids.length === 1){
    var a = A[ids[0]], q = QUADS[a.q];
    html = '<div class="pop"><div class="ph" style="background:'+q.color+'">'+icon(a.c,q.color,30)
         + '<div><div class="pn">'+esc(a.n)+'</div><div class="pm">'+CATS[a.c].label+' &middot; '+q.label+'</div></div></div>'
         + detail(a) + '</div>';
  } else {
    html = '<div class="pop"><div class="pt">'+ids.length+' actors at this location</div>'
         + ids.map(function(i){
             var a = A[i];
             return '<details><summary>'+popupIcon(a)+'<span>'+esc(a.n)+'</span></summary>'
                  + '<div class="pm" style="padding:0 12px;color:#555;opacity:1">'+CATS[a.c].label+' &middot; '+QUADS[a.q].label+'</div>'
                  + detail(a)+'</details>';
           }).join('')
         + '</div>';
  }
  popup = new mapboxgl.Popup({maxWidth:'none', offset:18, closeButton:true}).setLngLat(lngLat).setHTML(html).addTo(map);
}

map.on('click', 'clusters', function(e){
  var f = e.features[0];
  map.getSource('actors').getClusterExpansionZoom(f.properties.cluster_id, function(err, z){
    if (err) return;
    map.easeTo({center:f.geometry.coordinates, zoom:Math.min(z+0.5, 16)});
  });
});
map.on('click', 'actor-pts', function(e){
  var r = 10, bb = [[e.point.x-r, e.point.y-r],[e.point.x+r, e.point.y+r]];
  var fs = map.queryRenderedFeatures(bb, {layers:['actor-pts']});
  var seen = {}, ids = [];
  fs.forEach(function(f){ var i=f.properties.id; if(!seen[i]){ seen[i]=1; ids.push(i); } });
  if (!ids.length) ids = [e.features[0].properties.id];
  openPopup(ids, e.features[0].geometry.coordinates.slice());
});
['clusters','actor-pts'].forEach(function(l){
  map.on('mouseenter', l, function(){ map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave', l, function(){ map.getCanvas().style.cursor=''; });
});

document.getElementById('styles').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
  map.setStyle(STYLE_BASE + b.dataset.s);
});

/* ---------- Bottom bar ---------- */
var BTNS = [['search','Search',null],['filter','Filter all',null]]
  .concat(CATS.map(function(c,i){ return ['cat'+i, c.label, i]; }))
  .concat([['about','About',null]]);
var btnsEl = document.getElementById('btns');
btnsEl.innerHTML = BTNS.map(function(b){
  var ic = b[2] !== null ? icon(b[2], '#434343', 22) : '';
  var badge = (b[0]==='filter' || b[2] !== null) ? '<span class="badge">0</span>' : '';
  return '<button class="btn" data-p="'+b[0]+'" aria-pressed="false">'+ic+'<span>'+b[1]+'</span>'+badge+'</button>';
}).join('');

function updateBadges(){
  var tot = 0;
  CATS.forEach(function(_, c){
    var n = cnt(function(a){ return a.c===c && vis(a); });
    tot += n;
    btnsEl.querySelector('[data-p="cat'+c+'"] .badge').textContent = n;
  });
  btnsEl.querySelector('[data-p="filter"] .badge').textContent = tot;
}
function applyFilters(){
  var src = map.getSource('actors');
  if (src) src.setData(currentData());
  updateBadges();
  syncPanel();
}

/* ---------- Panels ---------- */
var panel = document.getElementById('panel'), pbody = document.getElementById('pbody'), ptitle = document.getElementById('ptitle');
var curPanel = null;

function sw(attrs, label, n){
  return '<label class="row"><span class="sw"><input type="checkbox" '+attrs+'></span><span class="lbl">'+label+'</span><span class="cnt">'+n+'</span></label>';
}
function quadRows(kind, c){
  return QUADS.map(function(q,i){
    var n = cnt(function(a){ return (c===null || a.c===c) && a.q===i; });
    var attr = 'data-k="'+kind+'"'+(c===null?'':' data-c="'+c+'"')+' data-v="'+i+'"';
    return sw(attr, '<i class="dot" style="background:'+q.color+'"></i>'+q.label+'<small>'+q.tag+'</small>', n);
  }).join('');
}
function zoneRows(kind, c){
  return ZONES.map(function(z,i){
    var n = cnt(function(a){ return (c===null || a.c===c) && a.z===i; });
    if (!n) return '';
    var attr = 'data-k="'+kind+'"'+(c===null?'':' data-c="'+c+'"')+' data-v="'+i+'"';
    return sw(attr, esc(z.n)+'<small>'+esc(z.i)+'</small>', n);
  }).join('');
}

function catPanel(c){
  return {title:CATS[c].label, light:false, html:
    '<div class="hero"><span class="hic">'+icon(c,'#4a5b64',30)+'</span><p>'+CATS[c].desc+'</p></div>'
    + '<div class="card">'+sw('data-k="cat" data-c="'+c+'"','Show on map', cnt(function(a){return a.c===c;}))+'</div>'
    + '<div class="card"><h3>Power / interest</h3>'+quadRows('q', c)+'</div>'
    + '<div class="card"><h3>Geopolitical zone</h3>'+zoneRows('z', c)+'</div>'};
}
function allPanel(){
  var crows = CATS.map(function(x,c){
    return sw('data-k="cat" data-c="'+c+'"', '<span class="mini" style="margin-right:8px;vertical-align:middle">'+icon(c,'#555',14)+'</span>'+x.label, cnt(function(a){return a.c===c;}));
  }).join('');
  return {title:'Filter all', light:false, html:
    '<div class="acts"><button data-act="all">Show all</button><button data-act="none">Clear all</button></div>'
    + '<div class="card"><h3>Actor type</h3>'+crows+'</div>'
    + '<div class="card"><h3>Power / interest</h3>'+quadRows('gq', null)+'</div>'
    + '<div class="card"><h3>Geopolitical zone</h3>'+zoneRows('gz', null)+'</div>'};
}
function searchPanel(){
  return {title:'Search', light:true, html:
    '<input id="sq" class="sq" type="search" placeholder="Type here" autocomplete="off" aria-label="Search actors">'
    + '<div id="sres" class="sres"></div>'};
}

function buildPanel(key){
  if (key==='search') return searchPanel();
  if (key==='filter') return allPanel();
  if (key==='about') return aboutPanel();
  return catPanel(+key.slice(3));
}

function openPanel(key){
  curPanel = key;
  var p = buildPanel(key);
  ptitle.textContent = p.title;
  pbody.innerHTML = p.html;
  pbody.scrollTop = 0;
  panel.classList.toggle('light', p.light);
  panel.classList.add('open');
  btnsEl.querySelectorAll('.btn').forEach(function(b){
    var on = b.dataset.p === key;
    b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
  });
  syncPanel();
  if (key === 'search'){
    var q = document.getElementById('sq');
    q.addEventListener('input', function(){ runSearch(q.value); });
    runSearch('');
    if (window.innerWidth > 700) q.focus();
  }
}
function closePanel(){
  curPanel = null;
  panel.classList.remove('open');
  btnsEl.querySelectorAll('.btn').forEach(function(b){ b.classList.remove('active'); b.setAttribute('aria-pressed', false); });
}
btnsEl.addEventListener('click', function(e){
  var b = e.target.closest('.btn'); if (!b) return;
  if (curPanel === b.dataset.p) closePanel(); else openPanel(b.dataset.p);
});
document.getElementById('pclose').addEventListener('click', closePanel);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePanel(); });

function syncPanel(){
  pbody.querySelectorAll('input[data-k]').forEach(function(i){
    var k = i.dataset.k, c = +i.dataset.c, v = +i.dataset.v, on;
    if (k==='cat') on = F[c].on;
    else if (k==='q') on = F[c].q.has(v);
    else if (k==='z') on = F[c].z.has(v);
    else if (k==='gq') on = F.every(function(f){ return f.q.has(v); });
    else on = F.every(function(f){ return f.z.has(v); });
    i.checked = on;
  });
}
pbody.addEventListener('change', function(e){
  var i = e.target; if (!i.dataset || !i.dataset.k) return;
  var k = i.dataset.k, c = +i.dataset.c, v = +i.dataset.v, on = i.checked;
  function tog(s){ if (on) s.add(v); else s.delete(v); }
  if (k==='cat') F[c].on = on;
  else if (k==='q') tog(F[c].q);
  else if (k==='z') tog(F[c].z);
  else if (k==='gq') F.forEach(function(f){ tog(f.q); });
  else if (k==='gz') F.forEach(function(f){ tog(f.z); });
  applyFilters();
});
pbody.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act){
    F.forEach(function(f){
      if (b.dataset.act === 'all'){
        f.on = true;
        f.q = new Set(QUADS.map(function(_,i){return i;}));
        f.z = new Set(ZONES.map(function(_,i){return i;}));
      } else { f.on = false; }
    });
    applyFilters();
  } else if (b.dataset.i){
    var a = A[+b.dataset.i];
    map.flyTo({center:[a.lo, a.la], zoom:Math.max(map.getZoom(), 10), essential:true});
    openPopup([+b.dataset.i], [a.lo, a.la]);
    if (window.innerWidth <= 700) closePanel();
  }
});

function runSearch(q){
  var out = document.getElementById('sres'); if (!out) return;
  q = q.trim().toLowerCase();
  if (!q){ out.innerHTML = '<div class="hint">Search '+A.length+' actors by name, state, zone or description.</div>'; return; }
  var hits = [];
  for (var i=0; i<A.length && hits.length<60; i++){
    var a = A[i];
    if ((a.n+' '+a.s+' '+ZONES[a.z].n+' '+a.d).toLowerCase().indexOf(q) !== -1) hits.push(i);
  }
  out.innerHTML = hits.length ? hits.map(function(i){
    var a = A[i];
    return '<button class="sr" data-i="'+i+'">'+popupIcon(a).replace('class="sic"','class="sic"')+'<span><b>'+esc(a.n)+'</b><small>'+esc(a.s)+' &middot; '+CATS[a.c].label+'</small></span></button>';
  }).join('') : '<div class="hint">No actors match &ldquo;'+esc(q)+'&rdquo;.</div>';
}

/* ---------- Legend ---------- */
(function(){
  var h = '<div class="lh">Symbol = actor type</div>'
    + CATS.map(function(c,i){ return '<div class="lr"><span class="mini" style="background:#33424a">'+icon(i,'#33424a',14)+'</span>'+c.label+'</div>'; }).join('')
    + '<div class="lh">Colour = power / interest</div>'
    + QUADS.map(function(q){ return '<div class="lr"><i class="dot" style="background:'+q.color+'"></i>'+q.label+'</div>'; }).join('');
  document.getElementById('legendBody').innerHTML = h;
  if (window.matchMedia('(min-width:701px)').matches) document.getElementById('legend').open = true;
})();

if (LINKEDIN_URL){ document.getElementById('li').innerHTML = '<a href="'+esc(LINKEDIN_URL)+'" target="_blank" rel="noopener">LinkedIn</a>'; }
updateBadges();
})();
</script>
