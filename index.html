#stage{position:relative;flex:1;min-height:0}

function syncPanel(){
  pbody.querySelectorAll('input[data-k]').forEach(function(i){
    var k = i.dataset.k, c = +i.dataset.c, v = +i.dataset.v, on;
    if (k==='lyr'){ i.checked = !!LY[i.dataset.v]; return; }
    if (k==='cat') on = F[c].on;
    else if (k==='q') on = F[c].q.has(v);
    else if (k==='z') on = F[c].z.has(v);
    else if (k==='gq') on = F.every(function(f){ return f.q.has(v); });
    else on = F.every(function(f){ return f.z.has(v); });
    i.checked = on;
  });
}
pbody.addEventListener('change', function(e){
  var i = e.target; if (!i.dataset || !i.dataset.k) return;
  var k = i.dataset.k, c = +i.dataset.c, v = +i.dataset.v, on = i.checked;
  if (k==='lyr'){ setLY(i.dataset.v, on); return; }
  function tog(s){ if (on) s.add(v); else s.delete(v); }
  if (k==='cat') F[c].on = on;
  else if (k==='q') tog(F[c].q);
  else if (k==='z') tog(F[c].z);
  else if (k==='gq') F.forEach(function(f){ tog(f.q); });
  else if (k==='gz') F.forEach(function(f){ tog(f.z); });
  applyFilters();
});

function polys(f){ var g=f.geometry; return g.type==='Polygon' ? [g.coordinates] : g.coordinates; }
function bboxOf(f){
  var b=[1e9,1e9,-1e9,-1e9];
  polys(f).forEach(function(p){ p[0].forEach(function(c){ b[0]=Math.min(b[0],c[0]); b[1]=Math.min(b[1],c[1]); b[2]=Math.max(b[2],c[0]); b[3]=Math.max(b[3],c[1]); }); });
  return b;
}
function outlineSVG(f, ids){
  var b = bboxOf(f), k = Math.cos((b[1]+b[3])/2*Math.PI/180), pad = 8, W = 240;
  var w = (b[2]-b[0])*k, h = b[3]-b[1], sc = (W-2*pad)/Math.max(w,h);
  var VW = Math.round(w*sc+2*pad), VH = Math.round(h*sc+2*pad);
  function X(x){ return ((x-b[0])*k*sc+pad).toFixed(1); }
  function Y(y){ return ((b[3]-y)*sc+pad).toFixed(1); }
  var d = '';
  polys(f).forEach(function(p){ p.forEach(function(r){ d += 'M'+r.map(function(c){ return X(c[0])+' '+Y(c[1]); }).join('L')+'Z'; }); });
  var dots = ids.map(function(i){
    var a = A[i]; if (a.lo<b[0]||a.lo>b[2]||a.la<b[1]||a.la>b[3]) return '';
    return '<circle cx="'+X(a.lo)+'" cy="'+Y(a.la)+'" r="4" fill="'+QUADS[a.q].color+'" stroke="#fff" stroke-width="1.5"/>';
  }).join('');
  return '<svg class="out" viewBox="0 0 '+VW+' '+VH+'" role="img" aria-label="Outline of the state with actor locations"><path d="'+d+'" fill="#cfd9dd" stroke="#52646d" stroke-width="1.2" fill-rule="evenodd"/>'+dots+'</svg>';

          return '<div class="ac"><div class="ah" style="background:'+q.color+'">'+icon(ci,q.color,26)+'<div><b>'+esc(a.n)+'</b><small>'+q.label+' &middot; '+q.tag+'</small></div></div>'

        }).join('');

    return '<button data-state="'+esc(s.properties.n)+'">'+esc(s.properties.n)+'</button>';
  }).join('');
  spage.innerHTML = '<div class="sp-top"><button id="sback">&larr; Back to map</button><span>Mapping Allies, Power and Resistance in the Ecology Space</span></div>'
    + '<div class="sp-wrap"><div class="sp-hero">'+outlineSVG(f, ids)
    + '<div class="tx"><h2>'+esc(dispName(n))+'</h2><span class="chip">'+esc(z.n)+' zone</span><span class="chip iss">'+esc(z.i)+'</span>'
    + '<p>'+esc(dispName(n))+' lies in the '+esc(z.n)+' zone, where the ecological issue studied is <b>'+esc(z.i.toLowerCase())+'</b>. '
    + p.l+' Local Government Area'+(p.l===1?' is':'s are')+' documented as affected in this state, and '+ids.length+' environmental actors are mapped here.</p>'
    + '<button class="go" id="sfly">Show on map</button></div></div>'
    + '<div class="tiles">'+tiles+'</div>'
    + (groups || '<p class="note">No actors with verified coordinates are mapped in this state yet.</p>')
    + (sibs ? '<h3 class="sp-h">Other states in the '+esc(z.n)+' zone</h3><div class="zone-chips">'+sibs+'</div>' : '')
    + '<p class="note" style="margin-top:22px">Editor: School of Ecology, 2025. Actor classifications are analytical judgements by the editors; credible public sources are linked where available.</p></div>';
  spage.scrollTop = 0;
  spage.classList.add('open');
  document.title = dispName(n)+' | Mapping Allies, Power and Resistance in the Ecology Space';
  return true;
}
function closeState(){ spage.classList.remove('open'); document.title = BASE_TITLE; }
var BASE_TITLE = document.title;
function route(){
  var m = /^#\/state\/(.+)$/.exec(location.hash), ok = false;
  if (m){ try { ok = renderState(decodeURIComponent(m[1])); } catch(e){ ok = false; } }
  if (!ok) closeState();
  else if (curPanel) closePanel();
}
window.addEventListener('hashchange', route);
spage.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.id==='sback'){ location.hash = ''; }
  else if (b.id==='sfly'){
    var m = /^#\/state\/(.+)$/.exec(location.hash), f = m && stateFeat(decodeURIComponent(m[1]));
    location.hash = '';
    if (f){ var bb = bboxOf(f); map.resize(); map.fitBounds([[bb[0],bb[1]],[bb[2],bb[3]]], {padding:40, duration:1200}); }
  } else if (b.dataset.state){ location.hash = '#/state/' + encodeURIComponent(b.dataset.state); }
});
document.addEventListener('keydown', function(e){ if (e.key==='Escape' && spage.classList.contains('open')) location.hash=''; });

if (LINKEDIN_URL){
  var sl = document.getElementById('siLink'); sl.href = LINKEDIN_URL; sl.target = '_blank'; sl.rel = 'noopener'; sl.title = 'SpatiallyINCLINED on LinkedIn';
}
updateBadges();
route();
})();
</script>
